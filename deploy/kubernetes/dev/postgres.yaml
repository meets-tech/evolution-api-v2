apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evolution-dev-postgres
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: oci-bv
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: evolution-postgres-dev
spec:
  selector:
    app: evolution-postgres-dev
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evolution-postgres-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: evolution-postgres-dev
  template:
    metadata:
      labels:
        app: evolution-postgres-dev
    spec:
      nodeSelector:
        env: dev
        alloc: apps
        kubernetes.io/arch: amd64
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: evolution
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: evolution-dev-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: evolution-dev-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: evolution-dev-postgres

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evolution-dev-redis
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: oci-bv
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: evolution-redis-dev
spec:
  selector:
    app: evolution-redis-dev
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evolution-redis-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: evolution-redis-dev
  template:
    metadata:
      labels:
        app: evolution-redis-dev
    spec:
      nodeSelector:
        env: dev
        alloc: apps
        kubernetes.io/arch: amd64
      containers:
        - name: redis
          image: redis:7-alpine
          command: [sh, -c, "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: evolution-dev-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            exec:
              command: [sh, -c, "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: evolution-dev-redis

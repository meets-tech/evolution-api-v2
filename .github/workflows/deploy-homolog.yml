name: Deploy Evolution API - HOMOLOG

on:
  workflow_dispatch:
  push:
    branches:
      - homolog

permissions:
  contents: read

concurrency:
  group: evolution-api-homolog
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy no servidor de homolog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.3
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.GERADOR_5 }}
          username: ${{ secrets.SERVER_CONTABO_USER }}
          password: ${{ secrets.SERVER_CONTABO_PASS }}
          envs: DEPLOY_TOKEN,DEPLOY_SHA
          command_timeout: 25m
          script: |
            set -eu

            readonly repository=/home/meets/projetos/evolution-api-v2
            test -d "$repository/.git"
            cd "$repository"

            if [ -n "$(git -c safe.directory="$repository" status --porcelain)" ]; then
              echo "Refusing to overwrite local changes in $repository" >&2
              exit 1
            fi

            git -c safe.directory="$repository" fetch --no-tags \
              "https://x-access-token:${DEPLOY_TOKEN}@github.com/meets-tech/evolution-api-v2.git" \
              "$DEPLOY_SHA"
            git -c safe.directory="$repository" reset --hard FETCH_HEAD

            cd deploy/homolog
            ./scripts/validate-env.sh .env
            docker compose config --quiet
            docker compose pull --ignore-buildable
            docker compose build --pull evolution-api
            docker compose up -d --remove-orphans
            docker compose ps

            EVOLUTION_DOMAIN=$(sed -n 's/^EVOLUTION_DOMAIN=//p' .env | tail -n 1)
            EVOLUTION_API_KEY=$(sed -n 's/^EVOLUTION_API_KEY=//p' .env | tail -n 1)
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              -H "apikey: ${EVOLUTION_API_KEY}" \
              "https://${EVOLUTION_DOMAIN}/instance/fetchInstances" >/dev/null
